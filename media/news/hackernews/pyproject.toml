[project]
name = "lo9i-hackernews"
version = "1.0.0"
description = "Hacker News stories, search and mentions, for lo9i"
requires-python = ">=3.12"
dependencies = ["mcp>=2.2.0", "httpx>=0.28"]

[project.scripts]
hackernews-mcp = "lo9i_hackernews.mcp_server:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=1.4.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lo9i_hackernews"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N"]
