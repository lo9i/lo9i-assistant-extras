[project]
name = "watchlist"
version = "0.1.0"
description = "Track movies, TV shows and YouTube channels"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "mcp>=2.2.0",
    "python-multipart>=0.0.32",
    "uvicorn>=0.54.0",
]

[project.scripts]
watchlist-mcp = "watchlist.mcp_server:main"
watchlist-web = "watchlist.web.app:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/watchlist"]

[tool.pytest.ini_options]
testpaths = ["tests"]
