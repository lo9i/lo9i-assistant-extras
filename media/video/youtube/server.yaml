# Installed by lo9i from this repository (Plugins in the web app, /plugins in the terminal app). The format is
# in lo9i's core/mcp/install.py. {dir} is this folder once installed, {data} a folder for its data that
# updates leave alone, {bin} the scripts of its own environment (built from its uv.lock).
name: youtube
# Shown in the Plugins page; raise it with every change worth updating to.
version: 1.1.2
# The plugin format (lo9i's core/repositories/formats.py): 2 for {bin}.
format: 2
description: Summarize YouTube videos, and download them, their audio as MP3, and their transcripts
# Shown beside it in the apps (lo9i's core/repositories/icons.py): a Lucide icon, or an SVG in this folder.
icon: icon.svg
fields:
  - key: YOUTUBE_DIR
    label: Download folder
    optional: true
# Shown above the field when installing.
steps:
  - "Downloads go to the folder you enter, on the computer the assistant runs on; leave it empty for your Downloads folder. The assistant tells you where each file is."
trusted: true

# Trusted: the downloads only write files to the download folder, so lo9i doesn't ask before each one.
# ffmpeg (for MP3s and for joining a video's picture and sound) is the system's, or the one the
# imageio-ffmpeg package brings.
command: "{bin}/youtube-mcp"

# Where its downloads go, so lo9i's disk use counts them (Settings → System, lo9i clean) and cleans them when the
# user asks (lo9i's core/mcp/downloads.py): the Download folder, else ~/Downloads, and of the files there only its
# own, named "<title> [<video id>].mp4" or ".mp3" (src/lo9i_youtube/downloads.py).
downloads:
  field: YOUTUBE_DIR
  default: ~/Downloads
  files: ['.* \[[\w-]{11}\]\.(mp4|mp3)']

# Its description, steps and fields in Spanish, for the apps shown in Spanish.
translations:
  es:
    description: "Resume videos de YouTube y descárgalos, su audio en MP3 y sus transcripciones"
    steps:
      - "Las descargas van a la carpeta que ingreses, en la computadora donde corre el asistente; déjala vacía para tu carpeta Descargas. El asistente te dice dónde está cada archivo."
    fields:
      YOUTUBE_DIR: {label: "Carpeta de descargas"}
