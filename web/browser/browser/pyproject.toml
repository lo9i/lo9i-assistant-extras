[project]
name = "lo9i-browser"
version = "1.0.0"
description = "A browser of its own with a persistent profile, for lo9i to read and use pages the user signed in to"
requires-python = ">=3.12"
dependencies = ["mcp>=2.3.0", "playwright>=1.64"]

[project.scripts]
browser-mcp = "lo9i_browser.mcp_server:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1.4.0",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lo9i_browser"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: needs the network and a browser (uv run pytest -m live)"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N"]
