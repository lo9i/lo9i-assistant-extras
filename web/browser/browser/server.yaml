# Installed by lo9i from this repository (Plugins in the web app, /plugins in the terminal app). The format is
# in lo9i's core/mcp/install.py. {data} is a folder for its data that updates leave alone, {bin} the scripts
# of its own environment (built from its uv.lock).
name: browser
# Shown in the Plugins page; raise it with every change worth updating to.
version: 1.0.0
# The plugin format (lo9i's core/repositories/formats.py): 7 for `approve`.
format: 7
description: A browser of the assistant's own, with a profile that keeps what you sign in to, so it reads pages that need your login (your YouTube home) and uses them when you approve
# Shown beside it in the apps (lo9i's core/repositories/icons.py): a Lucide icon, or an SVG in this folder.
icon: app-window
command: "{bin}/browser-mcp"
env:
  # The profile (profile/), which browser it's made with (engine.json), and the Chromium it downloads when
  # Google Chrome isn't installed (browsers/).
  BROWSER_DATA: "{data}"
# Its window opens on the user's screen for signing in; when lo9i runs from boot, outside their login session,
# it gets LO9I_LOGIN_SESSION and says the window can't show (lo9i's docs/login-session.md).
login_session: true
# Trusted: opening, reading, scrolling and screenshots only read pages, and showing the window, closing a
# tab or the window only change the browser itself, so lo9i doesn't ask before each.
trusted: true
# Clicking, typing and pressing keys act on a site as the user (a purchase, a post, a setting), on words a
# page wrote: they ask the user every time, even on this trusted server.
approve: [click, type_text, press_key]
steps:
  - "The browser is Google Chrome when it's installed, else a Chromium the plugin downloads the first time (about 150 MB). It has a profile of its own, apart from your browser."
  - "To sign in to a site (YouTube, Google), ask the assistant to show the browser's window, sign in there and close it: it stays signed in for later, scheduled jobs too."

# Its description and steps in Spanish, for the apps shown in Spanish.
translations:
  es:
    description: "Un navegador propio del asistente, con un perfil que guarda dónde inicias sesión, para leer páginas que necesitan tu cuenta (tu inicio de YouTube) y usarlas cuando lo apruebas"
    steps:
      - "El navegador es Google Chrome si está instalado; si no, un Chromium que el plugin descarga la primera vez (unos 150 MB). Tiene un perfil propio, aparte de tu navegador."
      - "Para iniciar sesión en un sitio (YouTube, Google), pide al asistente que muestre la ventana del navegador, inicia sesión ahí y ciérrala: queda la sesión iniciada para después, también para las tareas programadas."
