[project]
name = "agent-tasks"
version = "1.0.0"
description = "What lo9i's coding agent plugins share: tasks run by a detached worker, their records, and the MCP tools to start and follow them"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.2.0",
    "watchfiles>=1.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_tasks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N"]
