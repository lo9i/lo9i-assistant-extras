[project]
name = "claude-code-tasks"
version = "1.0.0"
description = "Coding tasks for Claude Code, started and followed from lo9i"
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk>=0.2.163",
    "httpx>=0.28.1",
    "starlette>=1.7.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
claude-code-worker = "claude_code_tasks.worker:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_code_tasks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N"]
