# Installed by lo9i from this repository (Plugins in the web app, /plugins in the terminal app). The format is
# in lo9i's core/mcp/install.py. {dir} is this folder once installed, {data} a folder for its data that
# updates leave alone, {bin} the scripts of its own environment (built from its uv.lock).
name: claude-code
# Shown in the Plugins page; raise it with every change worth updating to.
version: 2.0.2
# The plugin format (lo9i's core/repositories/formats.py): 3 for the agent's worker.
format: 3
description: Hand coding tasks to Claude Code, which works on them on its own in your repositories
# While the assistant's model is GitHub Copilot, Claude Code runs on that Copilot plan, with nothing to
# enter here (lo9i's core/mcp/logins.py, relay.py). A Claude token, when given, is used instead.
model_login: copilot
fields:
  - key: CLAUDE_TOKEN
    label: Claude token or Anthropic API key
    secret: true
    optional: true
    help: https://console.anthropic.com/settings/keys
# Shown above the field when installing.
steps:
  - "With GitHub Copilot as the assistant's model, leave the field empty: Claude Code uses your Copilot plan."
  - "Otherwise, with a Claude Pro or Max plan: on a computer with Claude Code, run claude setup-token and sign in. It prints a token that starts with sk-ant-oat. Or create an API key in the Anthropic Console (sk-ant-api)."
  - "A task edits files and runs commands in the repository it's given without asking, so the assistant asks you before each one starts."
trusted: false
# A coding agent (lo9i's docs/agent-plugins.md). lo9i gives the assistant tools to start and follow its
# tasks (start_task, task_status, list_tasks, stop_task); starting and stopping one ask the user first
# unless the plugin is trusted. /claude <folder> in the apps hands a conversation to it: each message
# runs as a task that continues the conversation's session in that folder. lo9i runs the worker for
# each task, detached, so it outlives a restart; the records are under {data}/tasks.
agent:
  command: claude
  name: Claude Code
  worker: "{bin}/claude-code-worker"
