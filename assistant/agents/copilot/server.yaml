# Installed by lo9i from this repository (Plugins in the web app, /plugins in the terminal app). The format is
# in lo9i's core/mcp/install.py. {dir} is this folder once installed, {data} a folder for its data that
# updates leave alone, {bin} the scripts of its own environment (built from its uv.lock).
name: copilot
# Shown in the Plugins page; raise it with every change worth updating to.
version: 2.0.2
# The plugin format (lo9i's core/repositories/formats.py): 3 for the agent's worker.
format: 3
description: Hand coding tasks to GitHub Copilot, which works on them on its own in your repositories
fields:
  - key: COPILOT_GITHUB_TOKEN
    label: GitHub token with Copilot Requests
    secret: true
    help: https://github.com/settings/personal-access-tokens/new
# Shown above the field when installing.
steps:
  - "You need a GitHub Copilot plan on your account."
  - "Open the field's link to create a fine-grained personal access token. Under Permissions, add Copilot Requests, then generate it."
  - "Paste it below. A task edits files and runs commands in the repository it's given without asking, so the assistant asks you before each one starts. The first task downloads the Copilot CLI (about 150 MB)."
trusted: false
# A coding agent (lo9i's docs/agent-plugins.md). lo9i gives the assistant tools to start and follow its
# tasks; starting and stopping one ask the user first unless the plugin is trusted. /copilot <folder> in
# the apps hands a conversation to it, as /claude does for Claude Code. lo9i runs the worker for each
# task, detached, so it outlives a restart; the records are under {data}/tasks, the downloaded CLI under
# {data}/cli.
agent:
  command: copilot
  name: GitHub Copilot
  worker: "{bin}/copilot-worker"
env:
  COPILOT_CLI_DIR: "{data}/cli"
  # Where the CLI finds lo9i's instructions (instructions/lo9i.instructions.md): it runs under lo9i's
  # daemon, so it must never stop it, and how to restart it instead.
  COPILOT_CUSTOM_INSTRUCTIONS_DIRS: "{dir}/instructions"
