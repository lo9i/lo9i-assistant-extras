# Installed by lo9i from this repository (Plugins in the web app, /plugins in the terminal app). The format is
# in lo9i's core/mcp/install.py and docs/channel-plugins.md. {dir} is this folder once installed, {data} a
# folder for its data that updates leave alone, {bin} the scripts of its own environment (built from its
# uv.lock).
name: telegram
# Shown in the Plugins page; raise it with every change worth updating to.
version: 1.1.1
description: Chat with the assistant on Telegram, and get its messages and reminders there
# lib/lo9i-chat is installed next to this folder, so the path dependency in pyproject.toml works.
libraries: [lo9i-chat]
fields:
  - {key: TELEGRAM_TOKEN, label: Bot token, secret: true, help: https://t.me/BotFather}
# Shown above the field when installing.
steps:
  - "The assistant talks to you through a Telegram bot of your own. To create it, open Telegram and start a chat with @BotFather (t.me/BotFather), Telegram's official bot for making bots."
  - "Send /newbot. BotFather asks for a name, which is what the chat shows (for example: My Assistant), then a username, which must be unique and end in bot (for example: my_assistant_42_bot)."
  - "BotFather answers with a token that looks like 123456789:AAH…. Copy the whole token and paste it below. Keep it private: anyone with it can control the bot."
  - "After installing, the setup shows a pairing code. Open your new bot in Telegram (BotFather links it), press Start, and send it the code. Only accounts paired this way can talk to the assistant."
env:
  # telegram.json (the paired accounts) lives here.
  TELEGRAM_DATA: "{data}"
trusted: false

# The bot, with long polling, so Telegram needs no public URL. lo9i keeps it running while the plugin
# is on; it talks to lo9i over HTTP (LO9I_URL, LO9I_CHANNEL, LO9I_CHANNEL_TOKEN).
channel:
  command: "{bin}/lo9i-telegram"
  style: A phone chat. Short messages. Simple Markdown only (bold, italics, code); no tables or headings.
