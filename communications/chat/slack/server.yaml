# Installed by lo9i from this repository (Plugins in the web app, /plugins in the terminal app). The format is
# in lo9i's core/mcp/install.py and docs/channel-plugins.md. {dir} is this folder once installed, {bin} the
# scripts of its own environment (built from its uv.lock).
name: slack
# Shown in the Plugins page; raise it with every change worth updating to.
version: 2.1.1
# The plugin format (lo9i's core/repositories/formats.py): 2 for {bin}.
format: 2
description: Chat with the assistant in Slack and get its messages there, and let it search, read and post in your workspace
# One Slack app, created from manifest.json, gives the three tokens.
fields:
  - key: SLACK_APP_TOKEN
    label: App token (xapp-)
    secret: true
    help: https://github.com/lo9i/lo9i-assistant-extras/blob/main/mcp/slack/manifest.json
  - {key: SLACK_BOT_TOKEN, label: Bot token (xoxb-), secret: true}
  - {key: SLACK_USER_TOKEN, label: User token (xoxp-), secret: true}
# Shown above the fields when installing.
steps:
  - "Open api.slack.com/apps, choose Create New App → From a manifest, and pick your workspace."
  - "Paste the manifest from the App token field's link (manifest.json in the extras), then Next → Create."
  - "In Basic Information → App-Level Tokens, choose Generate Token and Scopes, add the scope connections:write, and generate: that's the app token (xapp-)."
  - "In OAuth & Permissions, choose Install to your workspace, then Allow. The same page shows the Bot User OAuth Token (xoxb-) and the User OAuth Token (xoxp-)."
  - "Paste the three tokens below. Only you, the person who installed the app, can talk to the assistant: open the app under Apps in Slack's sidebar and send it a message."
trusted: false

# The workspace tools: search, read and post as the user. Posting isn't marked read-only, so lo9i
# asks the user before every post.
command: "{bin}/lo9i-slack-mcp"

# The chat, over Socket Mode, so Slack needs no public URL. lo9i keeps it running while the plugin is
# on; it talks to lo9i over HTTP (LO9I_URL, LO9I_CHANNEL, LO9I_CHANNEL_TOKEN).
channel:
  command: "{bin}/lo9i-slack"
  # The channel protocol it speaks (lo9i's docs/channel-plugins.md).
  protocol: 2
  style: A Slack DM. Short messages. Markdown is rendered, including code blocks and small tables.
