[project]
name = "lo9i-whatsapp"
version = "1.0.0"
description = "Chat with the lo9i assistant in your WhatsApp chat with yourself"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "neonize>=0.5.2,<0.6",
]

[project.scripts]
lo9i-whatsapp = "lo9i_whatsapp.app:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lo9i_whatsapp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N"]

[tool.ruff.lint.isort]
known-first-party = ["lo9i_whatsapp", "tests"]
