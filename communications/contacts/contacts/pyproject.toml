[project]
name = "lo9i-contacts"
version = "1.0.0"
description = "The people in the Mac's Contacts, for lo9i"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.2.0",
    "pyobjc-framework-Contacts>=11; sys_platform == 'darwin'",
]

[project.scripts]
contacts-mcp = "lo9i_contacts.mcp_server:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lo9i_contacts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N"]
