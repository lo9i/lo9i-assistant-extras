# Installed by lo9i from this repository (Plugins in the web app, /plugins in the terminal app). The format is
# in lo9i's core/mcp/install.py. {dir} is this folder once installed, {bin} the scripts of its own environment
# (built from its uv.lock).
name: contacts
# Shown in the Plugins page; raise it with every change worth updating to.
version: 1.2.0
# The plugin format (lo9i's core/repositories/formats.py): 5 for oauth.
format: 5
description: "Look people up in your contacts, on Google Contacts, a CardDAV account (iCloud, Fastmail, Nextcloud) or the Contacts on your Mac: their numbers, emails, birthdays and addresses"
# Shown beside it in the apps (lo9i's core/repositories/icons.py): a Lucide icon, or an SVG in this folder.
icon: contact
# Google's CardDAV server takes only OAuth: the user signs in to Google in the plugin's setup with an OAuth app of
# their own, as the google-drive plugin does, and lo9i gives the server the sign-in in LO9I_OAUTH (lo9i's
# core/mcp/plugin_oauth.py). The CardDAV scope is Google's only one for its CardDAV server; the tools only read.
oauth:
  provider: google
  scopes:
    - https://www.googleapis.com/auth/carddav
# Shown when installing.
steps:
  - "With Google Contacts, leave the three fields empty. Once installed, sign in with Google in the plugin's setup, with a Google OAuth app of your own (console.cloud.google.com, free; the gmail or google-drive plugin's project and client work too): enable the CardDAV API in APIs & Services → Library, set up the OAuth consent screen as External and publish it, and create an OAuth client ID of type Web application with the redirect URI the setup shows."
  - "With another CardDAV account, fill in its three fields; for iCloud the URL is https://contacts.icloud.com and the password an app-specific one."
  - "Without either, on a Mac, it reads the Mac's Contacts: the first time, macOS asks to allow access, and it works while the assistant runs in your login session, not when it was started at boot."
# Asked for when it's installed, all three or none. Empty, it reads Google Contacts once signed in, else the Mac's.
fields:
  - {key: CARDDAV_URL, label: "CardDAV URL (e.g. https://contacts.icloud.com)", optional: true}
  - {key: CARDDAV_USER, label: CardDAV user name (usually your email address), optional: true}
  - {key: CARDDAV_PASSWORD, label: CardDAV password (an app-specific one for iCloud), secret: true, optional: true, help: "https://account.apple.com"}
# Before the fields are saved, lo9i signs in to the CardDAV account with them (lo9i's docs/plugin-checks.md), so a
# wrong password shows in the install dialog. check_account is lo9i's; the agent never gets it.
check:
  tool: check_account
# It only reads, so trusting it changes nothing: find_contact is marked read-only.
trusted: false

command: "{bin}/contacts-mcp"
