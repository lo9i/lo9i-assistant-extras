# Installed by lo9i from this repository (Plugins in the web app, /plugins in the terminal app). The format is
# in lo9i's core/mcp/install.py. {dir} is this folder once installed, {bin} the scripts of its own environment
# (built from its uv.lock).
name: contacts
# Shown in the Plugins page; raise it with every change worth updating to.
version: 1.0.0
# The plugin format (lo9i's core/repositories/formats.py): 2 for {bin}.
format: 2
description: "Look people up in the Contacts on your Mac: their numbers, emails, birthdays and addresses"
# Contacts is macOS's: lo9i doesn't list the plugin on other systems.
platforms: [macos]
# Shown when installing.
steps:
  - "The first time the assistant looks someone up, macOS asks to allow access to Contacts."
  - "It works while the assistant runs in your login session, not when it was started at boot."
# It only reads, so trusting it changes nothing: find_contact is marked read-only.
trusted: false

command: "{bin}/contacts-mcp"
