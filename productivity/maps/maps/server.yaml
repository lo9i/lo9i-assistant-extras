# Installed by lo9i from this repository (Plugins in the web app, /plugins in the terminal app). The format is
# in lo9i's core/mcp/install.py. {bin} is the scripts of its own environment (built from its uv.lock).
name: maps
# Shown in the Plugins page; raise it with every change worth updating to.
version: 1.0.0
# The plugin format (lo9i's core/repositories/formats.py): 2 for {bin}.
format: 2
description: Places, addresses, routes and travel times by car, on foot, by bike and by public transport, from OpenStreetMap (no account needed)
# Shown beside it in the apps (lo9i's core/repositories/icons.py): a Lucide icon, or an SVG in this folder.
icon: map
trusted: true
# Trusted: every tool only reads public services (Nominatim, OSRM, Transitous, Buenos Aires' USIG).
command: "{bin}/maps-mcp"
