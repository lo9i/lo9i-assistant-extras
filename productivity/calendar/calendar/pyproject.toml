[project]
name = "lo9i-calendar"
version = "1.0.0"
description = "The user's calendars, over CalDAV and on the Mac, for lo9i"
requires-python = ">=3.12"
dependencies = [
    "caldav>=3.4.0",
    "icalendar>=7.3.0",
    "mcp>=2.2.0",
    "pyobjc-framework-eventkit>=11 ; sys_platform == 'darwin'",
    "recurring-ical-events>=3.8.2",
]

[project.scripts]
calendar-mcp = "lo9i_calendar.mcp_server:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1.4.0",
    "radicale>=3.8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lo9i_calendar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N"]
