# Installed by lo9i from this repository (Plugins in the web app, /plugins in the terminal app). The format is
# in lo9i's core/mcp/install.py. {dir} is this folder once installed, {data} a folder for its data that
# updates leave alone, {bin} the scripts of its own environment (built from its uv.lock), {socket} where the
# web page listens.
name: factory
# Shown in the Plugins page; raise it with every change worth updating to.
version: 1.1.1
# The plugin format (lo9i's core/repositories/formats.py): 2 for {bin}.
format: 2
description: A team of models debates a coding task in one of your repositories, you approve each step, and a coding agent builds it on a local branch
# Shown beside it in the apps (lo9i's core/repositories/icons.py): a Lucide icon, or an SVG in this folder.
icon: factory
# GitHub Copilot as a provider uses lo9i's own Copilot sign-in (Settings → Model), given to the server as
# LO9I_COPILOT_GITHUB_TOKEN (lo9i's core/mcp/logins.py). Claude Code runs on it too, through a relay
# (agents/relay.py), when models.implementer is copilot:<a Claude model>.
model_login: copilot
# All optional, but the team needs at least one provider: a key here, or Copilot as lo9i's model.
fields:
  - {key: ANTHROPIC_API_KEY, label: Anthropic API key, secret: true, optional: true, help: https://console.anthropic.com/settings/keys}
  - {key: OPENAI_API_KEY, label: OpenAI API key, secret: true, optional: true, help: https://platform.openai.com/api-keys}
# Shown above the fields when installing.
steps:
  - "Each role of the team (architect, implementer, reviewer, tester, security, judge) runs on the model you pick for it in the Factory page's Settings: Anthropic, OpenAI or GitHub Copilot."
  - "Enter the API keys of the providers you want to use. GitHub Copilot needs nothing here: it uses the assistant's own Copilot sign-in."
  - "The coding agent (Claude Code, or Codex) builds the approved plan on a branch of its own, with ANTHROPIC_API_KEY or OPENAI_API_KEY; Claude Code can use GitHub Copilot's Claude models instead, with no key. By default it runs in Docker, with only that branch's folder: keep Docker Desktop running. In local mode it runs on this computer instead, and asks you before every command."
command: "{bin}/factory-mcp"
env:
  FACTORY_DB: "{data}/factory.db"
# Not trusted: a task spends money on the providers and changes a repository, so lo9i asks the user before
# starting, approving or deleting one unless they trust the plugin.
trusted: false

# The page lo9i shows as Factory in its web app. It gets the env above and listens on {socket};
# lo9i signs the user in and serves it under /factory/ (X-Forwarded-Prefix).
page:
  command: "{bin}/factory-web"
  args: [--socket, "{socket}"]
