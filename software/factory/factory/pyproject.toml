[project]
name = "lo9i-factory"
version = "1.1.0"
description = "A software factory for lo9i: models debate a task, you approve, an agent builds it"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.15.0",
    "fastapi>=0.142.2",
    "httpx2>=2.14.0",
    "jinja2>=3.1.6",
    "markdown-it-py>=4.2.0",
    "mcp>=2.2.0",
    "openai>=3.35.1",
    "python-multipart>=0.0.32",
    "uvicorn>=0.54.0",
]

[project.scripts]
factory-mcp = "lo9i_factory.mcp_server:main"
factory-web = "lo9i_factory.web.app:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lo9i_factory"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N"]
