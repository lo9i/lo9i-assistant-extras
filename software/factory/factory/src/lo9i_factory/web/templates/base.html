<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {# Links are relative to where lo9i serves this (X-Forwarded-Prefix, see app.py). #}
  <base href="{{ request.scope.root_path }}/">
  <title>{% block title %}Factory{% endblock %}</title>
  <link rel="stylesheet" href="{{ asset('app.css') }}">
  <script src="{{ asset('htmx.min.js') }}"></script>
</head>
<body hx-boost="true">
  <header class="top">
    <div class="container">
      <a href="./" class="brand">factory</a>
      <nav>
        <a href="./" class="{{ 'on' if nav == 'board' }}">Board</a>
        <a href="settings" class="{{ 'on' if nav == 'settings' }}">Settings</a>
      </nav>
      {% block top_actions %}{% endblock %}
    </div>
  </header>

  {% block content %}{% endblock %}
  {% block dialogs %}{% endblock %}

  <div id="toast" class="toast" hidden></div>
  <script>
    function openDialog(id) {
      const d = document.getElementById(id);
      d.showModal();
      d.querySelector("input, textarea")?.focus();
    }
    // Clicking the backdrop closes a dialog.
    document.addEventListener("click", (e) => {
      if (e.target.tagName === "DIALOG") e.target.close();
    });
    // Errors outside forms come back as plain text; show them instead of failing silently.
    document.body.addEventListener("htmx:responseError", (e) => {
      const toast = document.getElementById("toast");
      toast.textContent = e.detail.xhr.responseText || "Something went wrong";
      toast.hidden = false;
      setTimeout(() => (toast.hidden = true), 8000);
    });
  </script>
</body>
</html>
