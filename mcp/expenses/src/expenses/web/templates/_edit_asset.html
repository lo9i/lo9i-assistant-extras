<div class="group-head editing" id="asset-{{ asset.id }}">
  <form class="stack" hx-post="assets/{{ asset.id }}" hx-target="#assets" hx-swap="outerHTML">
    {% set v = form or asset %}
    {% include "_asset_fields.html" %}
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <div class="buttons">
      <span class="spacer"></span>
      <button type="button" class="ghost" hx-get="assets" hx-target="#assets" hx-swap="outerHTML">Cancel</button>
      <button class="primary">Save</button>
    </div>
  </form>
</div>
