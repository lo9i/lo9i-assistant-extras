# Installed by lo9i from this repository (Plugins in the web app, /plugins in the terminal app). The format is in
# lo9i's core/mcp/install.py. An email provider runs nothing: lo9i connects its accounts with these
# servers, and they're added in this plugin's details once it's installed.
name: gmail
# Shown in the Plugins page; raise it with every change worth updating to.
version: 1.0.0
description: Send and read Gmail
category: communications
email:
  - id: gmail
    name: Gmail (app password)
    host: smtp.gmail.com
    port: 587
    imap_host: imap.gmail.com
    password_help: >-
      Gmail needs an app password, not your Google password. Turn on 2-Step Verification in your
      Google Account, create an app password, and paste its 16 characters without spaces.
    password_url: https://myaccount.google.com/apppasswords
  - id: gmail-oauth
    name: Gmail (sign in with Google)
    host: smtp.gmail.com
    port: 587
    imap_host: imap.gmail.com
    oauth: google
    password_help: >-
      Sign in with Google instead of an app password. It needs an OAuth app of your own: in Google
      Cloud Console, set up the OAuth consent screen (External, published), then create an OAuth
      client ID of type Web application with the redirect URI shown here, and paste its client ID
      and secret.
    password_url: https://console.cloud.google.com/apis/credentials
