[project]
name = "lo9i-slack"
version = "1.0.0"
description = "Chat with the lo9i assistant in Slack, and its tools for the user's workspace"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.3",
    "httpx>=0.28.1",
    "lo9i-chat",
    "mcp>=2.2.0",
    "slack-sdk>=3.44.1",
    "websockets>=16",
]

[project.scripts]
lo9i-slack = "lo9i_slack.app:main"
lo9i-slack-mcp = "lo9i_slack.mcp_server:main"

[tool.uv.sources]
lo9i-chat = { path = "../../lib/lo9i-chat", editable = true }

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lo9i_slack"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N"]

[tool.ruff.lint.isort]
known-first-party = ["lo9i_slack", "lo9i_chat", "tests"]
