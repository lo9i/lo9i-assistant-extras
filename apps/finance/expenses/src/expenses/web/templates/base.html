<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {# Links are relative to where lo9i serves this (X-Forwarded-Prefix, see app.py). #}
  <base href="{{ request.scope.root_path }}/">
  <title>{% block title %}Expenses{% endblock %}</title>
  <link rel="stylesheet" href="{{ asset('app.css') }}">
  <script src="{{ asset('htmx.min.js') }}"></script>
</head>
<body>
  <header class="top">
    <nav>
      <a href="./" class="{{ 'on' if nav == 'month' }}">Bills</a>
      <a href="assets" class="{{ 'on' if nav == 'assets' }}">Assets</a>
      <a href="categories" class="{{ 'on' if nav == 'categories' }}">Categories</a>
      <a href="settings" class="{{ 'on' if nav == 'settings' }}">Settings</a>
    </nav>
  </header>
  <main>
    <div id="toast" class="banner" hidden></div>
    {% block main %}{% endblock %}
  </main>
  <script>
    // Errors outside forms come back as plain text; show them instead of failing silently.
    document.body.addEventListener("htmx:responseError", (e) => {
      const toast = document.getElementById("toast");
      toast.textContent = e.detail.xhr.responseText || "Something went wrong";
      toast.hidden = false;
      setTimeout(() => (toast.hidden = true), 6000);
    });
  </script>
</body>
</html>
