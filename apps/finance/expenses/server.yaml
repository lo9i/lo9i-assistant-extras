# Installed by lo9i from this repository (Install in /mcp or /skills). The format is in lo9i's
# core/mcp/install.py. {dir} is this folder once installed, {data} a folder for its data that
# updates leave alone, {uv} the uv lo9i found, {socket} where the web page listens.
name: expenses
# Shown in the Plugins page; raise it with every change worth updating to.
version: 0.3.0
description: Assets, recurring obligations and bills, in your country's currency
command: "{uv}"
# uv builds its own environment from uv.lock on the first start, so that start is slow.
args: [run, --quiet, --project, "{dir}", --frozen, expenses-mcp]
env:
  EXPENSES_DB: "{data}/expenses.db"
trusted: false

# The page lo9i shows as Expenses in its web app. It gets the env above and listens on {socket};
# lo9i signs the user in and serves it under /expenses/ (X-Forwarded-Prefix).
page:
  command: "{uv}"
  args: [run, --quiet, --project, "{dir}", --frozen, expenses-web, --socket, "{socket}"]
