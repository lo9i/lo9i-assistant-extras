[project]
name = "expenses"
version = "0.1.0"
description = "Track assets, recurring obligations and bills"
requires-python = ">=3.12"
dependencies = [
    "babel>=2.18.0",
    "fastapi>=0.142.2",
    "jinja2>=3.1.6",
    "mcp>=2.2.0",
    "python-multipart>=0.0.32",
    "uvicorn>=0.54.0",
]

[project.scripts]
expenses-mcp = "expenses.mcp_server:main"
expenses-web = "expenses.web.app:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/expenses"]

[tool.pytest.ini_options]
testpaths = ["tests"]
