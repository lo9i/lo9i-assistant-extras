[project]
name = "billing"
version = "0.1.0"
description = "Argentine electronic invoices authorized by ARCA (ex AFIP)"
requires-python = ">=3.12"
dependencies = [
    "certifi>=2025.1.31",
    "cryptography>=44.0.0",
    "httpx>=0.28.1",
    "mcp>=2.2.0",
    "reportlab>=4.2.0",
]

[project.scripts]
billing-mcp = "billing.mcp_server:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/billing"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N"]
