<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {# Links are relative to where lo9i serves this (X-Forwarded-Prefix, see app.py). #}
  <base href="{{ request.scope.root_path }}/">
  <title>{% block title %}Billing{% endblock %}</title>
  <script src="{{ asset('theme.js') }}"></script>
  <link rel="stylesheet" href="{{ asset('app.css') }}">
  <script src="{{ asset('htmx.min.js') }}"></script>
</head>
{# No brand of its own: lo9i's sidebar names the page. The top bar has the tabs, as the app's pages do. #}
<body>
  <header class="topbar">
    <nav>
      <a href="./" class="{{ 'on' if nav == 'invoices' }}">Invoices</a>
      <a href="customers" class="{{ 'on' if nav == 'customers' }}">Customers</a>
      <a href="settings" class="{{ 'on' if nav == 'settings' }}">Settings</a>
    </nav>
  </header>
  <main>
    <div id="toast" class="banner" hidden></div>
    {% block main %}{% endblock %}
  </main>
  <script>
    // Errors outside forms come back as plain text; show them instead of failing silently.
    document.body.addEventListener("htmx:responseError", (e) => {
      const toast = document.getElementById("toast");
      toast.textContent = e.detail.xhr.responseText || "Something went wrong";
      toast.hidden = false;
      setTimeout(() => (toast.hidden = true), 6000);
    });

    // A customer's CUIT, once typed: ARCA's padrón fills the name and address still empty, and the IVA condition
    // unless one was picked (customers/lookup).
    document.body.addEventListener("change", async (e) => {
      const input = e.target;
      if (input.matches?.("select[name=iva_condition]")) input.dataset.chosen = "1";
      if (!input.matches?.("input[data-lookup]")) return;
      const form = input.form;
      const status = form.querySelector("[data-lookup-status]");
      const cuit = input.value.trim();
      if (!cuit) return;
      status.textContent = "Looking it up in ARCA…";
      let found;
      try {
        found = await (await fetch(`customers/lookup?cuit=${encodeURIComponent(cuit)}`)).json();
      } catch {
        found = { found: false, message: "Couldn't ask ARCA." };
      }
      if (input.value.trim() !== cuit) return; // typed again meanwhile
      status.textContent = found.message;
      if (!found.found) return;
      for (const [field, value] of [["name", found.name], ["address", found.address]]) {
        const el = form.elements[field];
        if (el && value && !el.value.trim()) el.value = value;
      }
      const iva = form.elements["iva_condition"];
      if (iva && found.iva_condition && !iva.dataset.chosen) iva.value = found.iva_condition;
    });
  </script>
</body>
</html>
