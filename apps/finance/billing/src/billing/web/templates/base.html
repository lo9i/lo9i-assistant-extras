<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {# Links are relative to where lo9i serves this (X-Forwarded-Prefix, see app.py). #}
  <base href="{{ request.scope.root_path }}/">
  <title>{% block title %}Billing{% endblock %}</title>
  <script src="{{ asset('theme.js') }}"></script>
  <link rel="stylesheet" href="{{ asset('app.css') }}">
  <script src="{{ asset('htmx.min.js') }}"></script>
</head>
{# No brand of its own: lo9i's sidebar names the page. The top bar has the tabs, as the app's pages do. #}
<body>
  <header class="topbar">
    <nav>
      <a href="./" class="{{ 'on' if nav == 'invoices' }}">Invoices</a>
      <a href="customers" class="{{ 'on' if nav == 'customers' }}">Customers</a>
      <a href="settings" class="{{ 'on' if nav == 'settings' }}">Settings</a>
    </nav>
  </header>
  <main>
    <div id="toast" class="banner" hidden></div>
    {% block main %}{% endblock %}
  </main>
  <script>
    // A message at the bottom of the screen, whatever is scrolled into view: what a save did (the server's
    // billing:told, app.py's _told), or an error outside a form, which comes back as plain text.
    let hiding;
    function tell(message, ok) {
      const toast = document.getElementById("toast");
      toast.textContent = message;
      toast.className = ok ? "notice" : "banner";
      toast.hidden = false;
      clearTimeout(hiding);
      hiding = setTimeout(() => (toast.hidden = true), ok ? 3500 : 8000);
    }
    document.body.addEventListener("billing:told", (e) => tell(e.detail.message, e.detail.ok));
    // Settings says what saving did by its Save button: that's brought into view, even when Enter was pressed
    // in a field near the top.
    document.body.addEventListener("htmx:afterSwap", (e) => {
      if (e.target.id === "settings") e.target.querySelector("form > .notice, form > .banner")?.scrollIntoView({ block: "center" });
    });
    document.body.addEventListener("htmx:responseError", (e) => tell(e.detail.xhr.responseText || "Something went wrong", false));

    // A customer's CUIT, once typed (its 11 digits, or on leaving the field): ARCA's padrón fills the name and
    // address still empty, and the IVA condition unless one was picked (customers/lookup).
    async function lookUp(input) {
      const cuit = input.value.trim();
      if (!cuit || input.dataset.looked === cuit) return;
      input.dataset.looked = cuit;
      const form = input.form;
      const status = form.querySelector("[data-lookup-status]");
      status.textContent = "Looking it up in ARCA…";
      let found;
      try {
        found = await (await fetch(`customers/lookup?cuit=${encodeURIComponent(cuit)}`)).json();
      } catch {
        found = { found: false, message: "Couldn't ask ARCA." };
        delete input.dataset.looked;
      }
      if (input.value.trim() !== cuit) return; // typed again meanwhile
      status.textContent = found.message;
      if (!found.found) return;
      for (const [field, value] of [["name", found.name], ["address", found.address]]) {
        const el = form.elements[field];
        if (el && value && !el.value.trim()) el.value = value;
      }
      const iva = form.elements["iva_condition"];
      if (iva && found.iva_condition && !iva.dataset.chosen) iva.value = found.iva_condition;
    }
    document.body.addEventListener("input", (e) => {
      if (e.target.matches?.("input[data-lookup]") && e.target.value.replace(/\D/g, "").length === 11) lookUp(e.target);
    });
    // Opening New customer starts at its CUIT. A toggle doesn't bubble, so it's caught on the way down.
    document.addEventListener(
      "toggle",
      (e) => e.target.id === "add-customer" && e.target.open && e.target.querySelector("input[data-lookup]")?.focus(),
      true,
    );
    document.body.addEventListener("change", (e) => {
      if (e.target.matches?.("select[name=iva_condition]")) e.target.dataset.chosen = "1";
      if (e.target.matches?.("input[data-lookup]")) lookUp(e.target);
    });
  </script>
</body>
</html>
