<details id="add-customer" class="card adder" {{ 'open' if open or not customers }}>
  <summary><span class="button primary small closed-only">+ Add customer</span><h2 class="open-only">New customer</h2></summary>
  <form class="stack" hx-post="customers" hx-target="#customers" hx-swap="outerHTML">
    {% set v = form or {} %}
    {% include "_customer_fields.html" %}
    <div class="form-grid">
      <label><span>Monthly net amount</span><input name="monthly_net" inputmode="decimal" value="{{ v.monthly_net or '' }}"><small class="hint">Before IVA, like 7.500.000. A raise is added later, from its month.</small></label>
    </div>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <div class="buttons"><button class="primary">Add customer</button></div>
  </form>
</details>
