<form id="add-channel" hx-post="channels" hx-disabled-elt="find button[type=submit]">
  <input class="input" name="channel" value="{{ channel or '' }}" placeholder="@handle, channel URL, or a link to one of its videos" required>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <div class="modal-foot">
    <button type="button" class="btn" onclick="this.closest('dialog').close()">Cancel</button>
    <button type="submit" class="btn primary">Add</button>
  </div>
</form>
