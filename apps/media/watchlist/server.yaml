# Installed by lo9i from this repository (Plugins in the web app, /plugins in the terminal app). The format is
# in lo9i's core/mcp/install.py. {dir} is this folder once installed, {data} a folder for its data that
# updates leave alone, {bin} the scripts of its own environment (built from its uv.lock), {socket} where the
# web page listens.
name: watchlist
# Shown in the Plugins page; raise it with every change worth updating to.
version: 0.3.1
# The plugin format (lo9i's core/repositories/formats.py): 2 for {bin}.
format: 2
description: Movies and TV shows to watch, how far you are in each show, and the YouTube channels you follow
fields:
  - {key: TMDB_API_KEY, label: TMDB API key, secret: true, help: https://www.themoviedb.org/settings/api}
# Shown above the field when installing.
steps:
  - "Posters, release dates and episodes come from TMDB, The Movie Database, whose API is free for personal use. Sign in at themoviedb.org (or create an account), then open Settings, API and request a key for personal use."
  - "Paste the API Key (the short one) or the API Read Access Token (the long one)."
command: "{bin}/watchlist-mcp"
env:
  WATCHLIST_DB: "{data}/watchlist.db"
# Trusted: its changes only touch the watchlist, and are undone on its page, so adding a title from a
# photo sent in Telegram doesn't wait for an approval.
trusted: true

# The page lo9i shows as Watchlist in its web app. It gets the env above and listens on {socket};
# lo9i signs the user in and serves it under /watchlist/ (X-Forwarded-Prefix).
page:
  command: "{bin}/watchlist-web"
  args: [--socket, "{socket}"]
