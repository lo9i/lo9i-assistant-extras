[project]
name = "hosts"
version = "0.1.0"
description = "The user's SSH hosts, with terminals that survive lost connections (Herdr)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2",
    "jinja2>=3.1.6",
    "mcp>=2.2.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
hosts-mcp = "hosts.mcp_server:main"
hosts-web = "hosts.web.app:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
    "pytest-asyncio>=1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hosts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N"]
