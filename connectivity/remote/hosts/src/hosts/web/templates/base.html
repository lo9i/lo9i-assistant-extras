<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {# Links are relative to where lo9i serves this (X-Forwarded-Prefix, see app.py). #}
  <base href="{{ request.scope.root_path }}/">
  <title>{% block title %}Hosts{% endblock %}</title>
  <script src="{{ asset('theme.js') }}"></script>
  <link rel="stylesheet" href="{{ asset('app.css') }}">
  {% block head %}{% endblock %}
  <script src="{{ asset('htmx.min.js') }}"></script>
</head>
{# No header of its own: lo9i's sidebar names the page, and each page has its top bar, as the app's do. #}
<body class="{% block body_class %}{% endblock %}">
  {% block content %}{% endblock %}

  <div id="toast" class="toast" role="status" hidden></div>
  <script>
    // What the page has to say, in a note at the bottom: a problem outside forms (which come back as plain text,
    // shown instead of failing silently), or what a change did (app.py's toast and hosts-reload, which loads the
    // page again first, with the host it names picked, and says it once loaded).
    (() => {
      const KEY = "hosts.toast";
      const toast = document.getElementById("toast");
      let timer;
      const say = (message, problem = false) => {
        toast.textContent = message;
        toast.classList.toggle("problem", problem);
        toast.hidden = false;
        clearTimeout(timer);
        timer = setTimeout(() => (toast.hidden = true), 6000);
      };
      document.body.addEventListener("htmx:responseError", (e) => {
        say(e.detail.xhr.responseText || "That didn't work. Try again in a moment.", true);
      });
      document.body.addEventListener("toast", (e) => say(e.detail.message));
      document.body.addEventListener("hosts-reload", (e) => {
        sessionStorage.setItem(KEY, e.detail.message);
        const url = new URL(location.href);
        if (e.detail.host) url.searchParams.set("host", e.detail.host);
        else url.searchParams.delete("host");
        location.replace(url);
      });
      const said = sessionStorage.getItem(KEY);
      if (said) {
        sessionStorage.removeItem(KEY);
        say(said);
      }
    })();
  </script>
</body>
</html>
