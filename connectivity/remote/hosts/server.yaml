# Installed by lo9i from this repository (Plugins in the web app, /plugins in the terminal app). The format is
# in lo9i's core/mcp/install.py. {data} is a folder for its data that updates leave alone, {bin} the scripts
# of its own environment (built from its uv.lock), {socket} where the web page listens.
name: hosts
# Shown in the Plugins page; raise it with every change worth updating to.
version: 0.3.2
# The plugin format (lo9i's core/repositories/formats.py): 2 for {bin}.
format: 2
description: Your Linux hosts from ~/.ssh/config, with a terminal in the web app that keeps running when the connection drops (Herdr), SSH tunnels you add and switch on and off from the hosts table, and tools for the assistant to run commands there
# Shown beside it in the apps (lo9i's core/repositories/icons.py): a Lucide icon, or an SVG in this folder.
icon: server
command: "{bin}/hosts-mcp"
env:
  HOSTS_DB: "{data}/hosts.db"
  # The page runs the tunnels; the tools start and stop them through it.
  HOSTS_WEB_SOCKET: "{socket}"
# Its ssh (the tools' and the page's) gets the user's ssh agent, for keys held only there (lo9i's
# core/mcp/ssh_agent.py); a lo9i from before it ignores this and passes none.
ssh_agent: true
# Not trusted: run_command can change a host, and starting a tunnel opens a port, so lo9i asks the user
# before each one. Listing hosts and tunnels and reading the terminal are read-only and run without asking.
trusted: false

# The page lo9i shows as Hosts in its web app. It gets the env above and listens on {socket}; lo9i signs
# the user in and serves it under /hosts/ (X-Forwarded-Prefix), its terminal's WebSocket too.
page:
  command: "{bin}/hosts-web"
  args: [--socket, "{socket}"]
